stages:
  - test
  - build
  - scan
  - sign
  - deploy-staging
  - deploy-production

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  API_IMAGE: $CI_REGISTRY_IMAGE/api-service:$CI_COMMIT_SHA
  AUTH_IMAGE: $CI_REGISTRY_IMAGE/auth-service:$CI_COMMIT_SHA

# Enable OIDC ID token for keyless Cosign authentication
default:
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore

# Stage 1: Static Application Security Testing (SAST)
sast-semgrep:
  stage: test
  image: returntocorp/semgrep:latest
  variables:
    JWT_SECRET: $JWT_SECRET
  script:
    - semgrep scan --config=auto --error .

# Stage 2: Build & Push Docker Images
build-images:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker build -t $API_IMAGE ./api-service
    - docker build --no-cache -t $AUTH_IMAGE ./auth-service
    - docker push $API_IMAGE
    - docker push $AUTH_IMAGE
    - docker save -o api-image.tar $API_IMAGE
    - docker save -o auth-image.tar $AUTH_IMAGE
  artifacts:
    paths:
      - api-image.tar
      - auth-image.tar
    expire_in: 1 hour

# Stage 3: Vulnerability Scanning, SBOM Generation & Dependency Management

# Job 1: Container Security Scanning & CycloneDX SBOM Export
trivy-container-scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --format cyclonedx --output sbom-api.json --input api-image.tar
    - trivy image --format cyclonedx --output sbom-auth.json --input auth-image.tar
    - trivy image --ignorefile .trivyignore --input $API_IMAGE --severity HIGH,CRITICAL --exit-code 1
    - trivy image --ignorefile .trivyignore --input $AUTH_IMAGE --severity HIGH,CRITICAL --exit-code 1
  artifacts:
    name: "sboms-$CI_COMMIT_SHORT_SHA"
    paths:
      - sbom-api.json
      - sbom-auth.json
    expire_in: 30 days
  rules:
    # Run automatically on standard commits to main
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"
    # Run specifically during scheduled CVE audit pipeline executions
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN != "true"

# Job 2: Automated Dependency Updates via Renovate
renovate-deps:
  stage: scan
  image: renovate/renovate:latest
  script:
    - renovate
  variables:
    RENOVATE_TOKEN: $RENOVATE_GITLAB_TOKEN
    RENOVATE_EXTRA_FLAGS: "$CI_PROJECT_PATH"
  rules:
    # Executes ONLY when a pipeline schedule passes RENOVATE_RUN="true"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"

# Stage 4: Keyless Image Signing with Cosign
sign-images:
  stage: sign
  image:
    name: bitnami/cosign:latest
    entrypoint: [""]
  script:
    - cosign login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - cosign sign --yes $API_IMAGE
    - cosign sign --yes $AUTH_IMAGE
    - cosign verify --certificate-identity-regexp "https://gitlab.com/" --certificate-oidc-issuer "https://gitlab.com" $API_IMAGE
    - cosign verify --certificate-identity-regexp "https://gitlab.com/" --certificate-oidc-issuer "https://gitlab.com" $AUTH_IMAGE

# Stage 5: Automated Staging Deployment
deploy-staging:
  stage: deploy-staging
  image: alpine/k8s:1.28.2
  environment:
    name: staging
    url: https://staging.example.com
  script:
    - echo "Deploying microservices to Staging environment..."
    - echo "API Image $API_IMAGE"
    - echo "Auth Image $AUTH_IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Stage 6: Production Deployment (Manual Gate)
deploy-production:
  stage: deploy-production
  image: alpine/k8s:1.28.2
  environment:
    name: production
    url: https://example.com
  script:
    - echo "Deploying verified microservices to Production..."
    - echo "Deploying API Image $API_IMAGE"
    - echo "Deploying Auth Image $AUTH_IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false
      