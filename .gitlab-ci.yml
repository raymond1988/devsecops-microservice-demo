stages:
  - test
  - build
  - scan
  - sign
  - infra-plan
  - infra-apply
  - deploy-staging
  - deploy-production

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  API_IMAGE: $CI_REGISTRY_IMAGE/api-service:$CI_COMMIT_SHA
  AUTH_IMAGE: $CI_REGISTRY_IMAGE/auth-service:$CI_COMMIT_SHA

default:
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore

# Stage 1: Static Application Security Testing (SAST)
sast-semgrep:
  stage: test
  image: returntocorp/semgrep:latest
  variables:
    JWT_SECRET: $JWT_SECRET
  script:
    - semgrep scan --config=auto --error .

# Stage 2: Build & Push Docker Images
build-images:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker build -t $API_IMAGE ./api-service
    - docker build --no-cache -t $AUTH_IMAGE ./auth-service
    - docker push $API_IMAGE
    - docker push $AUTH_IMAGE

# Stage 3: Vulnerability Scanning, SBOM Generation & Dependency Management

# Job 1: Container Security Scanning & CycloneDX SBOM Export
# Job 1: Container Security Scanning & CycloneDX SBOM Export
trivy-container-scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
  # Clear local scan cache
    - trivy clean --all
    - echo "$CI_REGISTRY_PASSWORD" | trivy registry login --username "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    
    # Generate CycloneDX SBOMs
    - trivy image --format cyclonedx --output sbom-api.json $API_IMAGE
    - trivy image --format cyclonedx --output sbom-auth.json $AUTH_IMAGE
    
    # Vulnerability Scanning
    - trivy image --ignorefile .trivyignore --severity HIGH,CRITICAL --exit-code 1 $API_IMAGE
    - trivy image --ignorefile .trivyignore --severity HIGH,CRITICAL --exit-code 1 $AUTH_IMAGE
  artifacts:
    name: "sboms-$CI_COMMIT_SHORT_SHA"
    paths:
      - sbom-api.json
      - sbom-auth.json
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN != "true"
    
# Job 2: Automated Dependency Updates via Renovate
renovate-deps:
  stage: scan
  image: renovate/renovate:latest
  script:
    - renovate
  variables:
    RENOVATE_TOKEN: $RENOVATE_GITLAB_TOKEN
    RENOVATE_EXTRA_FLAGS: "$CI_PROJECT_PATH"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"

# Stage 4: Keyless Image Signing with Cosign
sign-images:
  stage: sign
  image:
    name: bitnami/cosign:latest
    entrypoint: [""]
  script:
    - cosign login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - cosign sign --yes $API_IMAGE
    - cosign sign --yes $AUTH_IMAGE
    - cosign verify --certificate-identity-regexp "https://gitlab.com/" --certificate-oidc-issuer "https://gitlab.com" $API_IMAGE
    - cosign verify --certificate-identity-regexp "https://gitlab.com/" --certificate-oidc-issuer "https://gitlab.com" $AUTH_IMAGE

# Stage 5: Automated Staging Deployment
tf-plan:
  stage: infra-plan
  image:
    name: hashicorp/terraform:1.6.0
    entrypoint: [""]
  script:
    - cd terraform
    - terraform init
    - terraform fmt -check
    - terraform validate
    - terraform plan -out=tfplan
  artifacts:
    name: "tfplan-$CI_COMMIT_SHORT_SHA"
    paths:
      - terraform/tfplan
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Stage 6: Terraform Apply (Infra Provisioning)
tf-apply:
  stage: infra-apply
  image:
    name: hashicorp/terraform:1.6.0
    entrypoint: [""]
  script:
    - cd terraform
    - terraform init
    - terraform apply -auto-approve tfplan
  dependencies:
    - tf-plan
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Stage 7: Automated Staging Deployment
deploy-staging:
  stage: deploy-staging
  image: alpine/k8s:1.28.2
  environment:
    name: staging
    url: https://staging.example.com
  script:
    - echo "Deploying microservices to Staging environment..."
    - echo "API Image $API_IMAGE"
    - echo "Auth Image $AUTH_IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Stage 8: Production Deployment (Manual Gate)
deploy-production:
  stage: deploy-production
  image: alpine/k8s:1.28.2
  environment:
    name: production
    url: https://example.com
  script:
    - echo "Deploying verified microservices to Production..."
    - echo "Deploying API Image $API_IMAGE"
    - echo "Deploying Auth Image $AUTH_IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false