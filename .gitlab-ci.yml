stages:
  - test
  - build
  - scan

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  API_IMAGE: microservice-api:$CI_COMMIT_SHA
  AUTH_IMAGE: microservice-auth:$CI_COMMIT_SHA

# Stage 1: Static Application Security Testing (SAST)
sast-semgrep:
  stage: test
  image: returntocorp/semgrep:latest
  variables:
    JWT_SECRET: $JWT_SECRET
  script:
    - semgrep scan --config=auto --error .

# Stage 2: Build Docker Images using Docker-in-Docker
build-images:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
  script:
    - docker build -t $API_IMAGE ./api-service
    - docker build -t $AUTH_IMAGE ./auth-service
    # Save images as artifacts so the scan stage can load them
    - docker save -o api-image.tar $API_IMAGE
    - docker save -o auth-image.tar $AUTH_IMAGE
  artifacts:
    paths:
      - api-image.tar
      - auth-image.tar
    expire_in: 1 hour

# Stage 3: Container Vulnerability Scanning with Trivy
trivy-container-scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    # Scan api-service image archive directly
    - trivy image --input api-image.tar --severity HIGH,CRITICAL --exit-code 1
    # Scan auth-service image archive directly
    - trivy image --input auth-service-image.tar --severity HIGH,CRITICAL --exit-code 1
