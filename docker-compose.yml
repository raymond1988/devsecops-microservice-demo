version: '3.8'

services:
  api-service:
    build: ./api-service
    ports:
      - "3000:3000"
    read_only: true # Enforces read-only root filesystem
    tmpfs:
      - /tmp:rw,noexec,nosuid # Writable in-memory tmp mount without execution rights
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M

  auth-service:
    build: ./auth-service
    ports:
      - "5000:5000"
    read_only: true # Enforces read-only root filesystem
    tmpfs:
      - /tmp:rw,noexec,nosuid
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M