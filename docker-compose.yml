version: '3.8'

networks:
  internal-net:
    driver: bridge

services:
  api-service:
    build: ./api-service
    ports:
      - "3000:3000" # Exposed to host machine for external access
    networks:
      - internal-net
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5000

  auth-service:
    build: ./auth-service
    # Notice: No 'ports' mapping here. Reachable ONLY by api-service over internal-net
    networks:
      - internal-net